name: school_management_mobile
description: "ACS School Management — Admin & Principal Companion Mobile Application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  intl: ^0.19.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.10.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  # Avoid the transitive Android JNI CMake project that fails during Gradle metadata generation on Windows.
  path_provider_android: 2.2.19
  shared_preferences_android: 2.4.17

flutter:
  uses-material-design: true
